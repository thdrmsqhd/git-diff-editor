[package]
name = "git-diff-editor"
version = "0.1.0"
description = "HEAD vs working tree diff editor"
edition = "2021"

[lib]
name = "git_diff_editor_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
notify = { version = "7", default-features = true, features = ["macos_kqueue"] }
parking_lot = "0.12"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
lto = true
